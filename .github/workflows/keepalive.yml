# Supabase pauses free projects after 7 days without activity, and lives can be a month
# apart. This pings the database every 3 days so it stays awake.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 3 */3 * *" # every 3 days, 12:17 JST
  workflow_dispatch:

permissions:
  actions: write # lets the job reset GitHub's 60-day inactivity timer for scheduled jobs

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS -X POST "https://orytpvfmcganvnyyruye.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_fRfiUN0oxeYd57eNKi1pxQ_kmoYt9j-" \
            -H "Content-Type: application/json" -d '{}'
      # GitHub stops scheduled jobs in repositories without activity for 60 days;
      # re-enabling the workflow counts as activity.
      - name: Keep this schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
